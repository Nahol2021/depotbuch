<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nachrichten-Check</title>
<style>
:root{--bg:#fff;--fg:#1d1d1d;--mut:#6b6b6b;--line:#e2e2e2;--good:#1b7f4b;--warn:#a26200;--link:#1a4fd6}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#161616;--fg:#e9e9e9;--mut:#9a9a9a;--line:#2e2e2e;--good:#5cc98c;--warn:#e8b45a;--link:#8fb0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px 16px 48px}
main{max-width:700px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:19px;margin:30px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
p{margin:0 0 10px}
ul{margin:0 0 10px;padding-left:20px}
li{margin-bottom:8px}
a{color:var(--link)}
.mut{color:var(--mut)}
.tag{font-weight:bold}
.good{color:var(--good)}
.warn{color:var(--warn)}
.bad{color:#b3261e}
[hidden]{display:none!important}
.fazit{border-left:3px solid var(--line);padding-left:10px;margin:8px 0 0}
dt{font-weight:bold;margin-top:8px}
dd{margin:0 0 4px}
h3{font-size:16px;margin:30px 0 6px;color:var(--mut)}
.meta{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Nachrichten-Check</h1>
  <p class="mut" id="stand">lädt …</p>
  <p id="intro"></p>
  <div id="inhalt"></div>
  <h2 id="h-begriffe" hidden>Begriffe</h2>
  <dl id="begriffe"></dl>
</main>
<script>
(function(){
function $(id){ return document.getElementById(id); }
function el(tag, cls, kids){ var e = document.createElement(tag); if (cls) e.className = cls; (kids || []).forEach(function(k){ e.appendChild(typeof k === "string" ? document.createTextNode(k) : k); }); return e; }
/* Zahl und Einheit nicht trennen: "40 %" → geschütztes Leerzeichen */
function glue(t){ return t.replace(/(\d)\s+(%|€|\$|Euro|Dollar|US-Dollar|Mrd\.|Mio\.|Megawatt)/g, "$1 $2"); }
/* **fett** und *kursiv* umwandeln, sonst reiner Text (kein HTML aus den Daten) */
function rich(text){
  var out = [];
  glue(String(text || "")).split("**").forEach(function(part, i){
    if (i % 2){ out.push(el("b", null, [part])); return; }
    part.split(/\*([^*]+)\*/).forEach(function(q, j){ out.push(j % 2 ? el("i", null, [q]) : q); });
  });
  return out;
}
function kurzDatum(s){ var d = new Date(s + "T12:00:00"); return isNaN(d) ? "" : d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"}); }
var TON = {gut:"good", warn:"warn", schlecht:"bad"};
var ART = {"Gut":"good", "Entwarnung":"good", "Warnung":"warn", "Risiko":"warn", "Kleines Risiko":"warn", "Schlecht":"bad"};

function punkt(p){
  var kids = [el("span", "tag " + (ART[p.art] || ""), [p.art + ":"]), " "].concat(rich(p.text));
  var meta = [];
  if (p.datum) meta.push(kurzDatum(p.datum));
  if (p.quelle){
    if (p.url){ var q = el("a", null, [p.quelle]); q.href = p.url; q.target = "_blank"; q.rel = "noopener"; meta.push(q); }
    else meta.push(p.quelle);
  }
  if (meta.length){
    var m = el("span", "meta", [" ("]);
    meta.forEach(function(x, i){ if (i) m.appendChild(document.createTextNode(" · ")); m.appendChild(typeof x === "string" ? document.createTextNode(x) : x); });
    m.appendChild(document.createTextNode(")"));
    kids.push(m);
  }
  return el("li", null, kids);
}
function abschnitt(box, name, ak, klein){
  box.appendChild(el(klein ? "h3" : "h2", null, [name + " "].concat(ak && ak.stimmung ? [el("span", TON[ak.ton] || "", ["· " + ak.stimmung])] : [])));
  var punkte = (ak && ak.punkte || []).slice().sort(function(a, b){ return (b.datum || "").localeCompare(a.datum || ""); });
  if (!punkte.length){ box.appendChild(el("p", "mut", ["Keine neuen Meldungen in den letzten Tagen."])); return; }
  var ul = el("ul"); punkte.forEach(function(p){ ul.appendChild(punkt(p)); }); box.appendChild(ul);
  if (ak.fazit) box.appendChild(el("p", "fazit", [el("b", null, ["Für uns:"]), " "].concat(rich(ak.fazit))));
}

function get(n){ return fetch("data/" + n + ".json?t=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.json(); }); }
Promise.all([get("nachrichten"), get("plan").catch(function(){ return {}; })]).then(function(r){
  var n = r[0], plan = r[1];
  var d = new Date(n.datum + "T12:00:00");
  $("stand").textContent = "";
  $("stand").appendChild(document.createTextNode("Stand " + d.toLocaleDateString("de-DE", {day:"numeric", month:"long", year:"numeric"}) + (n.quelle ? " · " + n.quelle : "") + " · "));
  var a = el("a", null, ["zum Depotbuch"]); a.href = "./"; $("stand").appendChild(a);
  $("intro").textContent = n.intro || "";

  /* Jede unserer Aktien bekommt ihren festen Abschnitt, in der Reihenfolge des Plans; die Gesamtlage kommt zuletzt und kleiner */
  var byId = {}; (n.aktien || []).forEach(function(ak){ byId[ak.id] = ak; });
  var box = $("inhalt"), done = {markt: true};
  (plan.positionen || []).forEach(function(p){ done[p.id] = true; abschnitt(box, p.name, byId[p.id], false); });
  (n.aktien || []).forEach(function(ak){ if (!done[ak.id]){ done[ak.id] = true; abschnitt(box, ak.name, ak, false); } });
  if (byId.markt) abschnitt(box, byId.markt.name || "Gesamtlage", byId.markt, true);

  /* Nur Begriffe zeigen, die im Text auch vorkommen */
  var alles = (n.aktien || []).map(function(ak){ return (ak.punkte || []).map(function(p){ return p.text; }).join(" ") + " " + (ak.fazit || ""); }).join(" ").toLowerCase();
  var begriffe = (n.begriffe || []).filter(function(b){
    return String(b.wort).replace(/\(.*?\)/g, "").split("/").some(function(w){ w = w.replace(/[„“"]/g, "").trim().toLowerCase(); return w && alles.indexOf(w) >= 0; });
  });
  if (begriffe.length){
    $("h-begriffe").hidden = false;
    begriffe.forEach(function(b){ $("begriffe").appendChild(el("dt", null, [b.wort])); $("begriffe").appendChild(el("dd", null, rich(b.text))); });
  }
}).catch(function(){ $("stand").textContent = "Die Nachrichten konnten nicht geladen werden. Bitte später neu laden."; });
})();
</script>
</body>
</html>
