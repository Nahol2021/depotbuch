<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nachrichten-Check</title>
<style>
:root{--bg:#fff;--fg:#1d1d1d;--mut:#6b6b6b;--line:#e2e2e2;--good:#1b7f4b;--warn:#a26200;--link:#1a4fd6}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#161616;--fg:#e9e9e9;--mut:#9a9a9a;--line:#2e2e2e;--good:#5cc98c;--warn:#e8b45a;--link:#8fb0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px 16px 48px}
main{max-width:700px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:19px;margin:30px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
p{margin:0 0 10px}
ul{margin:0 0 10px;padding-left:20px}
li{margin-bottom:8px}
a{color:var(--link)}
.mut{color:var(--mut)}
.tag{font-weight:bold}
.good{color:var(--good)}
.warn{color:var(--warn)}
.bad{color:#b3261e}
[hidden]{display:none!important}
.fazit{border-left:3px solid var(--line);padding-left:10px;margin:8px 0 0}
dt{font-weight:bold;margin-top:8px}
dd{margin:0 0 4px}
</style>
</head>
<body>
<main>
  <h1>Nachrichten-Check</h1>
  <p class="mut" id="stand">lädt …</p>
  <p id="intro"></p>
  <div id="inhalt"></div>
  <h2 id="h-begriffe" hidden>Begriffe</h2>
  <dl id="begriffe"></dl>
</main>
<script>
(function(){
function $(id){ return document.getElementById(id); }
function el(tag, cls, kids){ var e = document.createElement(tag); if (cls) e.className = cls; (kids || []).forEach(function(k){ e.appendChild(typeof k === "string" ? document.createTextNode(k) : k); }); return e; }
/* **fett** wird fett dargestellt, alles andere bleibt reiner Text */
function rich(text){ var out = []; String(text || "").split("**").forEach(function(part, i){ out.push(i % 2 ? el("b", null, [part]) : part); }); return out; }
var TON = {gut:"good", warn:"warn", schlecht:"bad"};
var ART = {"Gut":"good", "Entwarnung":"good", "Warnung":"warn", "Risiko":"warn", "Kleines Risiko":"warn", "Schlecht":"bad"};
fetch("data/nachrichten.json?t=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.json(); }).then(function(n){
  var d = new Date(n.datum + "T12:00:00");
  $("stand").textContent = "";
  $("stand").appendChild(document.createTextNode("Stand " + d.toLocaleDateString("de-DE", {day:"numeric", month:"long", year:"numeric"}) + (n.quelle ? " · " + n.quelle : "") + " · "));
  var a = el("a", null, ["zum Depotbuch"]); a.href = "./"; $("stand").appendChild(a);
  $("intro").textContent = n.intro || "";
  var box = $("inhalt");
  (n.aktien || []).forEach(function(ak){
    box.appendChild(el("h2", null, [ak.name + " ", el("span", TON[ak.ton] || "", ["· " + (ak.stimmung || "")])]));
    var ul = el("ul");
    (ak.punkte || []).forEach(function(p){ ul.appendChild(el("li", null, [el("span", "tag " + (ART[p.art] || ""), [p.art + ":"]), " "].concat(rich(p.text)))); });
    box.appendChild(ul);
    if (ak.fazit) box.appendChild(el("p", "fazit", [el("b", null, ["Für uns:"]), " "].concat(rich(ak.fazit))));
  });
  if (n.ohneMeldung && n.ohneMeldung.length){
    box.appendChild(el("h2", null, [n.ohneMeldung.join(" und ")]));
    box.appendChild(el("p", null, ["Keine Meldungen dabei."]));
  }
  if (n.begriffe && n.begriffe.length){
    $("h-begriffe").hidden = false;
    n.begriffe.forEach(function(b){ $("begriffe").appendChild(el("dt", null, [b.wort])); $("begriffe").appendChild(el("dd", null, rich(b.text))); });
  }
}).catch(function(){ $("stand").textContent = "Die Nachrichten konnten nicht geladen werden. Bitte später neu laden."; });
})();
</script>
</body>
</html>
